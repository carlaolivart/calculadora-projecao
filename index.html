<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de projeção</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; }
    label { display: block; margin-top: 12px; }
    input { padding: 6px; width: 100%; }
    button { margin-top: 16px; margin-right: 8px; padding: 10px 16px; background: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #resultado { margin-top: 20px; font-size: 18px; }
    #historico { margin-top: 24px; font-size: 14px; }
    #aviso { margin-top: 12px; font-size: 14px; color: #b3261e; }
    #usuario { font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <h1>Calculadora de projeção de volume</h1>

  <div id="login">
    <h2>Entrar</h2>
    <label>E-mail</label>
    <input id="email" type="email">
    <label>Senha (mínimo 6 caracteres)</label>
    <input id="senha" type="password">
    <button onclick="entrar()">Entrar</button>
    <button onclick="criarConta()">Criar conta</button>
  </div>

  <div id="app" style="display:none">
    <div id="usuario"></div>
    <button onclick="sair()" style="background:#666;margin-top:8px">Sair</button>

    <label>Volume mensal atual (unidades)</label>
    <input id="volume" type="number" value="1000">

    <label>Crescimento mensal (%)</label>
    <input id="crescimento" type="number" value="5">

    <label>Quantidade de meses</label>
    <input id="meses" type="number" value="12">

    <button onclick="calcular()">Calcular</button>
    <button onclick="salvar()">Salvar cenário</button>

    <div id="resultado"></div>
    <div id="historico"></div>
  </div>

  <div id="aviso"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var db = supabase.createClient(
      'https://jnkfvbkwpkljtnuagyqx.supabase.co',
      'sb_publishable_ml_IKusLcvDYndIP1T_-Jg_f4iY_9uL'
    );

    var ultimo = null;

    function avisar(texto) { document.getElementById('aviso').textContent = texto || ''; }

    async function criarConta() {
      avisar('');
      var r = await db.auth.signUp({
        email: document.getElementById('email').value,
        password: document.getElementById('senha').value
      });
      if (r.error) { avisar(r.error.message); return; }
      if (!r.data.session) { avisar('Conta criada. Se o Supabase exigir confirmação, confirme pelo e-mail e depois clique em Entrar.'); }
    }

    async function entrar() {
      avisar('');
      var r = await db.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('senha').value
      });
      if (r.error) { avisar(r.error.message); }
    }

    async function sair() { await db.auth.signOut(); }

    function atualizarTela(sessao) {
      document.getElementById('login').style.display = sessao ? 'none' : 'block';
      document.getElementById('app').style.display = sessao ? 'block' : 'none';
      if (sessao) {
        document.getElementById('usuario').textContent = 'Logada como ' + sessao.user.email;
        setTimeout(mostrar, 0);
      } else {
        document.getElementById('historico').innerHTML = '';
        document.getElementById('resultado').innerHTML = '';
      }
    }

    db.auth.onAuthStateChange(function (evento, sessao) { atualizarTela(sessao); });

    function calcular() {
      var volume = Number(document.getElementById('volume').value);
      var taxa = Number(document.getElementById('crescimento').value) / 100;
      var meses = Number(document.getElementById('meses').value);
      var total = 0;
      var atual = volume;
      for (var i = 1; i <= meses; i++) {
        atual = atual * (1 + taxa);
        total = total + atual;
      }
      ultimo = { volume: volume, crescimento: taxa * 100, meses: meses, volume_final: Math.round(atual), total: Math.round(total) };
      document.getElementById('resultado').innerHTML =
        'Volume no mês ' + meses + ': ' + ultimo.volume_final.toLocaleString('pt-BR') + '<br>' +
        'Total acumulado: ' + ultimo.total.toLocaleString('pt-BR');
    }

    async function salvar() {
      avisar('');
      if (!ultimo) { avisar('Clique em Calcular antes de salvar.'); return; }
      var resp = await db.from('cenarios').insert(ultimo);
      if (resp.error) { avisar('Erro ao salvar: ' + resp.error.message); return; }
      mostrar();
    }

    async function mostrar() {
      var resp = await db.from('cenarios').select('*').order('created_at', { ascending: false }).limit(10);
      var caixa = document.getElementById('historico');
      if (resp.error) { caixa.textContent = 'Erro ao carregar: ' + resp.error.message; return; }
      var html = '<strong>Seus cenários salvos</strong><br>';
      if (resp.data.length === 0) { html += 'Nenhum ainda.'; }
      resp.data.forEach(function (c) {
        html += Number(c.volume) + ' un, ' + Number(c.crescimento) + '% ao mês, ' + Number(c.meses) + ' meses: total ' + Number(c.total).toLocaleString('pt-BR') + '<br>';
      });
      caixa.innerHTML = html;
    }

    db.auth.getSession().then(function (r) { atualizarTela(r.data.session); });
  </script>
</body>
</html>
